# Azure Static Web Apps CI/CD
# Deploys the FRONTEND Vite app to Azure Static Web Apps
# Production Vite environment variables are set for the build step.

name: Build and Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build frontend
        env:
          VITE_API_URL: https://campus-placement-api-2026-eac4gag8amhdddba.centralindia-01.azurewebsites.net
          VITE_ENTRA_CLIENT_ID: ce7d0818-e254-43c7-89c7-85a8a794801f
          VITE_ENTRA_TENANT_ID: bc9cd8e7-1801-4d9b-9c0d-c39cb60a7a19
          VITE_ENTRA_AUTHORITY: https://login.microsoftonline.com/bc9cd8e7-1801-4d9b-9c0d-c39cb60a7a19
          VITE_ENTRA_REDIRECT_URI: https://calm-stone-010abd900.5.azurestaticapps.net/
          VITE_ENTRA_SCOPES: openid,profile,email
        run: |
          cd FRONTEND
          npm ci
          npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for GitHub integrations (i.e., PR comments)
          action: "upload"
          app_location: "FRONTEND"
          output_location: "dist"
          skip_app_build: true
